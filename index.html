<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7f4ee"><title>一起出去玩 · 时间预约</title>
<style>
:root{--bg:#f7f4ee;--card:#fffdf9;--ink:#252a35;--muted:#858996;--line:#e8e4dc;--accent:#5467df;--accent2:#eef0ff}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}header{padding:25px 18px 20px;background:linear-gradient(135deg,#e7eaff,#f7f4ee 75%);border-bottom:1px solid var(--line)}.wrap{max-width:1050px;margin:auto}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--accent);font-weight:800}h1{font-size:clamp(26px,5vw,38px);margin:8px 0 7px}.sub{color:#686d7b;font-size:14px;line-height:1.6;margin:0}main{max-width:1050px;margin:auto;padding:16px 14px 40px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}.toolbar button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 13px;font-size:14px;font-weight:650;cursor:pointer}.toolbar button.primary,.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.weeklabel{font-weight:800;font-size:15px;margin-right:auto}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:8px 0 14px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:8px;overflow-x:auto;padding-bottom:8px}.day{min-width:105px}.dayhead{text-align:center;padding:10px 4px 12px;font-weight:800;font-size:13px}.dayhead small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.slots{display:flex;flex-direction:column;gap:7px}.slot{width:100%;min-height:67px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 8px;cursor:pointer;overflow:hidden}.slot .time{font-size:11px;color:var(--muted);display:block;margin-bottom:6px}.slot .name{font-size:12px;line-height:1.35;font-weight:750;display:block;overflow-wrap:anywhere}.slot .mini{font-size:10px;color:var(--muted);display:block;margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot.empty{border-style:dashed;background:rgba(255,255,255,.45)}.slot.booked{background:var(--accent2);border-color:#d4d9ff}.slot.selected{outline:2px solid var(--accent);outline-offset:1px}.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.8fr);gap:14px;margin-top:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.card h2{font-size:17px;margin:0 0 5px}.muted{font-size:13px;color:var(--muted);line-height:1.6}label{display:block;font-size:12px;font-weight:800;color:#5c6270;margin:14px 0 6px}input,textarea{font:inherit;width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;color:var(--ink);outline:none}textarea{min-height:82px;resize:vertical}.actions{display:flex;gap:8px;margin-top:15px}.actions button{flex:1}.status{font-size:12px;margin-top:10px;color:var(--muted);min-height:18px}.summary-list{display:flex;flex-direction:column;gap:9px;margin-top:13px}.summary-item{border:1px solid var(--line);border-radius:12px;padding:11px}.summary-item strong{font-size:13px}.summary-item p{margin:5px 0 0;font-size:12px;color:var(--muted);line-height:1.5}.emptymsg{font-size:13px;color:var(--muted);padding:10px 0}.foot{text-align:center;font-size:11px;color:#9b9da5;padding:20px 0}.pill{font-size:11px;padding:4px 7px;background:#f0f1f5;border-radius:20px;color:#6d7180;margin-left:6px}@media(max-width:700px){.below{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(7,108px);margin-right:-14px;padding-right:14px}.toolbar{gap:6px}.toolbar button{padding:9px 10px}.weeklabel{width:100%;margin-bottom:4px}.card{padding:15px}header{padding-top:22px}}
</style></head><body><header><div class="wrap"><div class="eyebrow">OUR LITTLE PLAN</div><h1>一起出去玩with小琳 ☀️</h1><p class="sub">挑一个空闲时段，写下想吃什么、玩什么。都可以查看和修改，想到什么就一起安排。不过这个时间段有点零散 主要是不太好编译</p></div></header>
<main><div class="toolbar"><span class="weeklabel" id="weekLabel">本周安排</span><button id="prevWeek">← 上一周</button><button id="thisWeek">回到本周</button><button id="nextWeek">下一周 →</button><button class="primary" id="todayBtn">跳到今天</button></div>
<div class="legend"><span><i class="dot" style="background:#fff;border:1px dashed #c9c4ba"></i>空闲时段</span><span><i class="dot" style="background:#dfe3ff"></i>已有安排（点击可修改）</span><span>每日 12:00–23:00 · 每小时一格</span></div>
<div class="calendar" id="calendar"></div><div class="below"><section class="card"><h2>安排这个时段 <span class="pill">大家可编辑</span></h2><div class="muted" id="selectedText">先点上面日历里的任意一个时间格。</div><label for="activity">出去玩项目 / 想做什么</label><input id="activity" maxlength="100" placeholder="例如：看电影、逛公园、桌游、散步"><label for="food">吃什么 / 去哪吃</label><input id="food" maxlength="100" placeholder="例如：火锅、日料、想吃的店"><label for="note">备注</label><textarea id="note" maxlength="1000" placeholder="例如：集合地点、预算、带什么、谁有空……"></textarea><div class="actions"><button class="btn primary" id="saveBtn">保存安排</button><button class="btn" id="clearBtn">清空此时段</button></div><div class="status" id="status">正在同步安排……</div></section><aside class="card"><h2>本周安排速览</h2><div class="muted">把已填写的时间集中列在这里，方便快速看哪天有计划。</div><div id="summary" class="summary-list"><div class="emptymsg">还没有安排，先点一个时间段吧。</div></div></aside></div><div class="foot">一起商量，不用一次安排完。每个时段都可以反复修改。</div></main>
<script>
const API_BASE="/.netlify/functions/plans";
const $=id=>document.getElementById(id),dayNames=["周日","周一","周二","周三","周四","周五","周六"],hours=Array.from({length:11},(_,i)=>i+12);
let weekStart=mondayOf(new Date()),selected=null,records={};
function mondayOf(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);x.setHours(0,0,0,0);return x}
function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function pretty(d){return `${d.getMonth()+1}/${d.getDate()}`}function slotKey(date,hour){return `${date}_${hour}`}function labelTime(h){return `${String(h).padStart(2,"0")}:00–${String(h+1).padStart(2,"0")}:00`}
function dates(){return Array.from({length:7},(_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d})}
function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function render(){const ds=dates();$("weekLabel").textContent=`${pretty(ds[0])} – ${pretty(ds[6])} · 一周安排`;const cal=$("calendar");cal.innerHTML="";
ds.forEach(d=>{const date=dateKey(d),col=document.createElement("div");col.className="day";col.innerHTML=`<div class="dayhead">${dayNames[d.getDay()]}<small>${pretty(d)}${date===dateKey(new Date())?" · 今天":""}</small></div><div class="slots"></div>`;const list=col.querySelector(".slots");
hours.forEach(h=>{const key=slotKey(date,h),r=records[key]||{},b=!!(r.activity||r.food||r.note),btn=document.createElement("button");btn.className="slot "+(b?"booked":"empty")+(selected===key?" selected":"");btn.innerHTML=`<span class="time">${labelTime(h)}</span><span class="name">${esc(r.activity||"＋ 添加安排")}</span>${r.food?`<span class="mini">🍜 ${esc(r.food)}</span>`:""}`;btn.onclick=()=>choose(key,date,h);list.appendChild(btn)});cal.appendChild(col)});renderSummary()}
function choose(key,date,h){selected=key;const r=records[key]||{};$("selectedText").textContent=`${date}（${dayNames[new Date(date+"T12:00:00").getDay()]}） · ${labelTime(h)}`;$("activity").value=r.activity||"";$("food").value=r.food||"";$("note").value=r.note||"";$("status").textContent="已选中时段。修改后点击“保存安排”。";render()}
function renderSummary(){const box=$("summary"),ds=dates(),keys=Object.entries(records).filter(([k,r])=>ds.some(d=>k.startsWith(dateKey(d)+"_"))).filter(([k,r])=>r.activity||r.food||r.note).sort((a,b)=>a[0].localeCompare(b[0]));box.innerHTML=keys.length?"":'<div class="emptymsg">这周还没有安排，先点一个时间段吧。</div>';keys.forEach(([k,r])=>{const m=k.match(/^(\d{4}-\d{2}-\d{2})_(\d+)$/);if(!m)return;const d=new Date(m[1]+"T12:00:00"),el=document.createElement("div");el.className="summary-item";el.innerHTML=`<strong>${dayNames[d.getDay()]} ${pretty(d)} · ${labelTime(+m[2])}</strong><p>${r.activity?`🎯 ${esc(r.activity)}<br>`:""}${r.food?`🍜 ${esc(r.food)}<br>`:""}${r.note?`📝 ${esc(r.note)}`:""}</p>`;el.onclick=()=>choose(k,m[1],+m[2]);el.style.cursor="pointer";box.appendChild(el)})}
async function api(path="",options={}){const res=await fetch(API_BASE+path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});if(!res.ok)throw new Error(await res.text());return res}
async function loadWeek(){const ds=dates(),from=dateKey(ds[0]),to=dateKey(ds[6]);try{const res=await api(`?from=${from}&to=${to}`),rows=await res.json();records={};rows.forEach(r=>records[slotKey(r.date,r.hour)]={activity:r.activity||"",food:r.food||"",note:r.note||""});render();$("status").textContent="共享安排已同步。"}catch(e){$("status").textContent="读取失败：请刷新重试，或检查网络。";render()}}
$("saveBtn").onclick=async()=>{if(!selected){$("status").textContent="请先从上方选择一个时间段。";return}const [date,hour]=selected.split("_"),r={activity:$("activity").value.trim(),food:$("food").value.trim(),note:$("note").value.trim()};$("saveBtn").disabled=true;$("status").textContent="正在保存……";try{await api("",{method:"POST",body:JSON.stringify({date,hour:+hour,...r})});records[selected]=r;render();$("status").textContent="保存成功，大家刷新页面即可看到最新安排。"}catch(e){$("status").textContent="保存失败：请刷新重试，或检查网络。"}finally{$("saveBtn").disabled=false}};
$("clearBtn").onclick=async()=>{if(!selected){$("status").textContent="请先选择一个时间段。";return}if(!confirm("确定清空这个时段的安排吗？"))return;const [date,hour]=selected.split("_");try{await api(`?date=${date}&hour=${hour}`,{method:"DELETE"})}catch(e){$("status").textContent="清空失败，请重试。";return}delete records[selected];$("activity").value="";$("food").value="";$("note").value="";render();$("status").textContent="已清空，其他人刷新后会同步。"};
function shift(n){weekStart.setDate(weekStart.getDate()+n*7);selected=null;loadWeek()}$("prevWeek").onclick=()=>shift(-1);$("nextWeek").onclick=()=>shift(1);$("thisWeek").onclick=()=>{weekStart=mondayOf(new Date());selected=null;loadWeek()};$("todayBtn").onclick=()=>{weekStart=mondayOf(new Date());const d=new Date(),h=Math.max(12,Math.min(22,d.getHours()));loadWeek().then(()=>choose(slotKey(dateKey(d),h),dateKey(d),h))};loadWeek();
</script></body></html>
